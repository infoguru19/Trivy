name: Trivy Scan & Docker Push

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
    # Checkout source code
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Docker Buildx
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker image
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:latest .

    # Trivy Image Scan (Security Gate)
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@0.20.0
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/myapp:latest
        severity: HIGH,CRITICAL
        exit-code: 1
        format: table

    # Trivy Filesystem Scan (Secrets + IaC)
    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@0.20.0
      with:
        scan-type: fs
        scanners: vuln,secret,config
        severity: HIGH,CRITICAL
        exit-code: 1

    # Push Docker Image (Only if scans pass)
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest
